syntax = "proto3";

package order;

option go_package = "./order";

message orderItemInput {
  int64 book_id = 1;
  int64 quantity = 2;
}

message orderItem {
  int64 book_id = 1;
  string isbn = 2;
  string title = 3;
  int64 unit_price = 4;
  int64 quantity = 5;
  int64 line_total = 6;
}

message prepareOrderReq {
  string access_token = 1;
  string conversation_id = 2;
  repeated orderItemInput items = 3;
  string idempotency_key = 4;
}

message prepareOrderResp {
  string confirmation_token = 1;
  string expires_at = 2;
  repeated orderItem items = 3;
  int64 total_amount = 4;
  string currency = 5;
}

message decideConfirmationReq {
  string access_token = 1;
  string confirmation_token = 2;
  string conversation_id = 3;
  string decision = 4;
}

message orderRecord {
  int64 order_id = 1;
  string status = 2;
  repeated orderItem items = 3;
  int64 total_amount = 4;
  string currency = 5;
  string created_at = 6;
  bool replayed = 7;
}

message confirmationResult {
  string confirmation_id = 1;
  string decision = 2;
  string status = 3;
  orderRecord order = 4;
  bool replayed = 5;
}

message getOrderReq {
  string access_token = 1;
  int64 order_id = 2;
}

message listMyOrdersReq {
  string access_token = 1;
  int32 limit = 2;
  string cursor = 3;
}

message listMyOrdersResp {
  repeated orderRecord orders = 1;
  string next_cursor = 2;
}

service orderService {
  rpc prepareOrder(prepareOrderReq) returns(prepareOrderResp);
  rpc decideConfirmation(decideConfirmationReq) returns(confirmationResult);
  rpc getOrder(getOrderReq) returns(orderRecord);
  rpc listMyOrders(listMyOrdersReq) returns(listMyOrdersResp);
}
