name: ${COMPOSE_PROJECT_NAME:-bookstore}

x-go: &go
  image: bookstore-go:local
  build:
    context: .
    dockerfile: deploy/go.Dockerfile
  restart: unless-stopped
  networks: [bookstore]
  environment:
    MYSQL_DSN: bookstore_business:${MYSQL_BUSINESS_PASSWORD:?run deploy/init-local.ps1}@tcp(mysql:3306)/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4&parseTime=true&loc=UTC
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
    CONFIRMATION_TTL: ${CONFIRMATION_TTL:-10m}
    SMTP_SEND_TIMEOUT: ${SMTP_SEND_TIMEOUT:-5s}
    AUTH_RPC_TIMEOUT: ${AUTH_RPC_TIMEOUT:-10s}
    AUTH_HTTP_TIMEOUT: ${AUTH_HTTP_TIMEOUT:-15s}
    AUTH_WEB_TIMEOUT: ${AUTH_WEB_TIMEOUT:-20s}
    TRUSTED_PROXY_CIDRS: 172.30.11.20/32
  volumes:
    - jwt-public:/keys/public:ro
  depends_on:
    bootstrap: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
    etcd: {condition: service_healthy}

x-agent-environment: &agent-environment
  CATALOG_RPC_ADDR: check-rpc:8081
  ORDER_RPC_ADDR: order-rpc:8083
  REDIS_ADDR: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  AGENT_MYSQL_DSN: mysql://bookstore_agent:${MYSQL_AGENT_PASSWORD:?run deploy/init-local.ps1}@mysql:3306/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4
  JWT_PUBLIC_KEY_PATH: /keys/public/jwt-public.pem
  JWT_ISSUER: bookstore
  MODEL_BASE_URL: ${MODEL_BASE_URL:?configure model gateway}
  MODEL_API_KEY: ${MODEL_API_KEY:?configure model gateway key}
  MODEL_ADAPTER: ${MODEL_ADAPTER:-deepseek-chat-json-v1}
  MODEL_PROFILE: ${MODEL_PROFILE:-deepseek-flash-v1}
  PROMPT_SET_VERSION: ${PROMPT_SET_VERSION:-v3-evidence-grounded}
  ROUTER_MODEL: ${ROUTER_MODEL:-deepseek-v4-flash}
  AGENT_MODEL: ${AGENT_MODEL:-deepseek-v4-flash}
  VERIFIER_MODEL: ${VERIFIER_MODEL:-deepseek-v4-flash}
  MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-8192}
  MODEL_TIMEOUT: ${MODEL_TIMEOUT:-30s}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://ws-bl3h1eur581tnntn.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3.7-text-embedding}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-20}
  EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-30s}
  POLICY_COLLECTION: ${POLICY_COLLECTION:-bookstore_policy_qwen37_1024_v1}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  BUILD_COMMIT: ${BUILD_COMMIT:-development}
  GUEST_RATE_LIMIT_HMAC_KEY: ${GUEST_RATE_LIMIT_HMAC_KEY:?run deploy/init-local.ps1}
  TRUSTED_PROXY_CIDRS: 172.30.11.20/32
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAME: bookstore-agent
  AGENT_MAX_NODES: ${AGENT_MAX_NODES:-12}
  AGENT_MAX_DEPTH: ${AGENT_MAX_DEPTH:-4}
  AGENT_MAX_PARALLEL: ${AGENT_MAX_PARALLEL:-3}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-20}
  CONFIRMATION_TTL: ${CONFIRMATION_TTL:-10m}
  CONFIRMATION_BINDING_TTL: ${CONFIRMATION_BINDING_TTL:-24h}
  MEMORY_COLLECTION: ${MEMORY_COLLECTION:-bookstore_memory_qwen37_1024_v1}
  MEMORY_INFERRED_MIN_CONFIDENCE: ${MEMORY_INFERRED_MIN_CONFIDENCE:-0.85}
  INVENTORY_STREAM: ${INVENTORY_STREAM:-inventory.events}
  INVENTORY_STREAM_GROUP: ${INVENTORY_STREAM_GROUP:-inventory-watch-workers}
  INVENTORY_STREAM_DLQ: ${INVENTORY_STREAM_DLQ:-inventory.events.dlq}
  INVENTORY_STREAM_BLOCK: ${INVENTORY_STREAM_BLOCK:-5s}
  INVENTORY_STREAM_BATCH_SIZE: ${INVENTORY_STREAM_BATCH_SIZE:-20}
  INVENTORY_STREAM_CLAIM_IDLE: ${INVENTORY_STREAM_CLAIM_IDLE:-60s}
  INVENTORY_EVENT_MAX_ATTEMPTS: ${INVENTORY_EVENT_MAX_ATTEMPTS:-10}
  INVENTORY_EVENT_RETENTION: ${INVENTORY_EVENT_RETENTION:-7d}
  INVENTORY_WATCH_DEFAULT_TTL: ${INVENTORY_WATCH_DEFAULT_TTL:-30d}
  INVENTORY_WATCH_MAX_TTL: ${INVENTORY_WATCH_MAX_TTL:-90d}
  INVENTORY_WATCH_EXPIRY_SCAN_INTERVAL: ${INVENTORY_WATCH_EXPIRY_SCAN_INTERVAL:-60s}
  TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-30}
  TRACE_PURGE_INTERVAL: ${TRACE_PURGE_INTERVAL:-1h}
  TRACE_PURGE_GRACE: ${TRACE_PURGE_GRACE:-24h}
  TRACE_MAX_JSON_BYTES: ${TRACE_MAX_JSON_BYTES:-65536}
  TRACE_MAX_FINAL_ANSWER_BYTES: ${TRACE_MAX_FINAL_ANSWER_BYTES:-32768}
  TRACE_MAX_ERROR_BYTES: ${TRACE_MAX_ERROR_BYTES:-2048}
  TRACE_MAX_EVIDENCE_BYTES: ${TRACE_MAX_EVIDENCE_BYTES:-8192}
  TRACE_MAX_RUN_BYTES: ${TRACE_MAX_RUN_BYTES:-2097152}
  TRACE_STEP_PAGE_SIZE: ${TRACE_STEP_PAGE_SIZE:-100}
  REPLAY_MAX_PER_USER_PER_HOUR: ${REPLAY_MAX_PER_USER_PER_HOUR:-5}
  REPLAY_MAX_CONCURRENT_PER_USER: ${REPLAY_MAX_CONCURRENT_PER_USER:-1}
  REPLAY_LEASE_TTL: ${REPLAY_LEASE_TTL:-60s}
  MODEL_PROFILE_MANIFEST_PATH: ${MODEL_PROFILE_MANIFEST_PATH:-config/model-profiles.yaml}
  PROMPT_MANIFEST_PATH: ${PROMPT_MANIFEST_PATH:-prompts/manifest.yaml}
  PRICING_MANIFEST_PATH: ${PRICING_MANIFEST_PATH:-pricing/pricing-v1.json}
  EVAL_RETENTION_DAYS: ${EVAL_RETENTION_DAYS:-180}
  EVAL_ARTIFACT_DIR: ${EVAL_ARTIFACT_DIR:-evals/reports}
  LLM_JUDGE_ENABLED: ${LLM_JUDGE_ENABLED:-false}
  JUDGE_MODEL_PROFILE: ${JUDGE_MODEL_PROFILE:-deepseek-pro-v1}
  JUDGE_PROMPT_VERSION: ${JUDGE_PROMPT_VERSION:-recommendation-v1}
  GUEST_CHAT_REQUESTS_PER_HOUR: ${GUEST_CHAT_REQUESTS_PER_HOUR:-20}
  GUEST_CHAT_MAX_CONCURRENT_PER_IP: ${GUEST_CHAT_MAX_CONCURRENT_PER_IP:-2}
  GUEST_CHAT_TIMEOUT: ${GUEST_CHAT_TIMEOUT:-120s}

x-agent: &agent
  image: bookstore-agent:local
  build:
    context: .
    dockerfile: agent/Dockerfile
  environment: *agent-environment
  networks: [bookstore]
  volumes:
    - jwt-public:/keys/public:ro
  restart: unless-stopped
  depends_on:
    bootstrap: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
    check-rpc: {condition: service_healthy}
    order-rpc: {condition: service_healthy}


services:
  mysql:
    image: mysql:8.0.45
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run deploy/init-local.ps1}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookstore}
    command: [--default-time-zone=+00:00]
    volumes: [mysql-data:/var/lib/mysql]
    networks: [bookstore]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    environment:
      REDIS_ARGS: --appendonly yes --appendfsync everysec
    volumes: [redis-data:/data]
    networks: [bookstore]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  etcd:
    image: registry.cn-hangzhou.aliyuncs.com/google_containers/etcd:3.5.0-0
    command: [etcd, --name=bookstore, --data-dir=/etcd-data, --listen-client-urls=http://0.0.0.0:2379, --advertise-client-urls=http://etcd:2379]
    volumes: [etcd-data:/etcd-data]
    networks: [bookstore]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health, --endpoints=http://127.0.0.1:2379]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes: [qdrant-data:/qdrant/storage]
    networks: [bookstore]
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports: [127.0.0.1:8025:8025]
    networks: [bookstore]
    restart: unless-stopped
  migrate:
    <<: *go
    command: [bookstore-migrate]
    restart: "no"
    environment:
      BOOKSTORE_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:?run deploy/init-local.ps1}@tcp(mysql:3306)/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4&parseTime=true&loc=UTC
    depends_on:
      mysql: {condition: service_healthy}
    volumes: []
  bootstrap:
    <<: *agent
    user: "0:0"
    command: [python, /app/deploy/bootstrap.py]
    restart: "no"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookstore}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run deploy/init-local.ps1}
      MYSQL_BUSINESS_PASSWORD: ${MYSQL_BUSINESS_PASSWORD:?run deploy/init-local.ps1}
      MYSQL_AGENT_PASSWORD: ${MYSQL_AGENT_PASSWORD:?run deploy/init-local.ps1}
      MYSQL_PUBLISHER_PASSWORD: ${MYSQL_PUBLISHER_PASSWORD:?run deploy/init-local.ps1}
    volumes: [jwt-private:/keys/private, jwt-public:/keys/public]
    depends_on:
      migrate: {condition: service_completed_successfully}
  add-rpc:
    <<: *go
    command: [add-rpc, -f, /app/config/add.yaml]
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8080"]
      interval: 5s
      timeout: 3s
      retries: 20
  check-rpc:
    <<: *go
    command: [check-rpc, -f, /app/config/check.yaml]
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8081"]
      interval: 5s
      timeout: 3s
      retries: 20
  auth-rpc:
    <<: *go
    command: [auth-rpc, -f, /app/config/auth.yaml]
    environment:
      MYSQL_DSN: bookstore_business:${MYSQL_BUSINESS_PASSWORD:?run deploy/init-local.ps1}@tcp(mysql:3306)/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4&parseTime=true&loc=UTC
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@bookstore.local}
      SMTP_SEND_TIMEOUT: ${SMTP_SEND_TIMEOUT:-5s}
      AUTH_RPC_TIMEOUT: ${AUTH_RPC_TIMEOUT:-10s}
      AUTH_HTTP_TIMEOUT: ${AUTH_HTTP_TIMEOUT:-15s}
      AUTH_WEB_TIMEOUT: ${AUTH_WEB_TIMEOUT:-20s}
      AUTH_RESEND_IP_LIMIT: ${AUTH_RESEND_IP_LIMIT:-30}
      AUTH_RESEND_EMAIL_LIMIT: ${AUTH_RESEND_EMAIL_LIMIT:-5}
      AUTH_RESEND_WINDOW: ${AUTH_RESEND_WINDOW:-1h}
      AUTH_RESEND_COOLDOWN: ${AUTH_RESEND_COOLDOWN:-60s}
    volumes: [jwt-private:/keys/private:ro, jwt-public:/keys/public:ro]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      etcd: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8082"]
      interval: 5s
      timeout: 3s
      retries: 20
  order-rpc:
    <<: *go
    command: [order-rpc, -f, /app/config/order.yaml]
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "8083"]
      interval: 5s
      timeout: 3s
      retries: 20
  go-api:
    <<: *go
    command: [bookstore-api, -f, /app/config/api.yaml]
    depends_on:
      add-rpc: {condition: service_healthy}
      check-rpc: {condition: service_healthy}
      auth-rpc: {condition: service_healthy}
      order-rpc: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8888/api/books/search?limit=1]
      interval: 5s
      timeout: 4s
      retries: 20
  outbox-publisher:
    <<: *go
    command: [outbox-publisher]
    environment:
      OUTBOX_MYSQL_DSN: bookstore_publisher:${MYSQL_PUBLISHER_PASSWORD:?run deploy/init-local.ps1}@tcp(mysql:3306)/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4&parseTime=true&loc=UTC
      REDIS_ADDR: redis://redis:6379/0
      INVENTORY_STREAM: ${INVENTORY_STREAM:-inventory.events}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_LEASE_TTL: ${OUTBOX_LEASE_TTL:-30s}
      OUTBOX_RETRY_BASE: ${OUTBOX_RETRY_BASE:-1s}
      OUTBOX_RETRY_MAX: ${OUTBOX_RETRY_MAX:-5m}
      OUTBOX_ALERT_AFTER_ATTEMPTS: ${OUTBOX_ALERT_AFTER_ATTEMPTS:-10}
      BUSINESS_OUTBOX_RETENTION: ${BUSINESS_OUTBOX_RETENTION:-30d}
  knowledge-index:
    <<: *agent
    command: [python, -m, app.knowledge_index]
    restart: "no"
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      qdrant: {condition: service_started}
  agent-api:
    <<: *agent
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      check-rpc: {condition: service_healthy}
      order-rpc: {condition: service_healthy}
      knowledge-index: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
  agent-worker:
    <<: *agent
    command: [agent-worker]
  trace-worker:
    <<: *agent
    command: [trace-worker]
  web:
    image: bookstore-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      GO_API_URL: http://go-api:8888
      AGENT_API_URL: http://agent-api:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY_HEADERS: "true"
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
      SMTP_SEND_TIMEOUT: ${SMTP_SEND_TIMEOUT:-5s}
      AUTH_RPC_TIMEOUT: ${AUTH_RPC_TIMEOUT:-10s}
      AUTH_HTTP_TIMEOUT: ${AUTH_HTTP_TIMEOUT:-15s}
      AUTH_WEB_TIMEOUT: ${AUTH_WEB_TIMEOUT:-20s}
    networks:
      bookstore: {ipv4_address: 172.30.11.20}
    depends_on:
      go-api: {condition: service_healthy}
      agent-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${APP_PORT:-8088}:80"]
    volumes: [./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [bookstore]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.13.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports: [127.0.0.1:9090:9090]
    volumes: [./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro, prometheus-data:/prometheus]
    networks: [bookstore]
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.10.5
    command: [-config.file=/etc/tempo/tempo.yml]
    ports: [127.0.0.1:3200:3200]
    volumes: [./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro, tempo-data:/var/tempo]
    networks: [bookstore]
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: [--config=/etc/otelcol-contrib/config.yml]
    volumes: [./observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro]
    networks: [bookstore]
    depends_on: [tempo]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.1.0
    ports: [127.0.0.1:3001:3000]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run deploy/init-local.ps1}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [bookstore]
    depends_on: [prometheus, tempo]
    restart: unless-stopped

networks:
  bookstore:
    ipam:
      config: [{subnet: 172.30.11.0/24, ip_range: 172.30.11.128/25}]
volumes:
  mysql-data:
  redis-data:
  etcd-data:
  qdrant-data:
  jwt-private:
  jwt-public:
  prometheus-data:
  tempo-data:
  grafana-data:
