name: ${COMPOSE_PROJECT_NAME:-bookstore}

x-go-image: &go-image
  image: bookstore-go:local
  build:
    context: .
    dockerfile: deploy/go.Dockerfile
  networks: [bookstore]
  restart: unless-stopped

x-agent-image: &agent-image
  image: bookstore-agent:local
  build:
    context: .
    dockerfile: agent/Dockerfile
  networks: [bookstore]
  restart: unless-stopped

x-business-env: &business-env
  MYSQL_DSN: bookstore_business:${MYSQL_BUSINESS_PASSWORD:?run deploy/init-local.ps1}@tcp(mysql:3306)/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4&parseTime=true&loc=UTC
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CONFIRMATION_TTL: ${CONFIRMATION_TTL:-10m}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@bookstore.local}
  SMTP_SEND_TIMEOUT: ${SMTP_SEND_TIMEOUT:-5s}
  AUTH_RPC_TIMEOUT: ${AUTH_RPC_TIMEOUT:-10s}
  AUTH_HTTP_TIMEOUT: ${AUTH_HTTP_TIMEOUT:-15s}
  AUTH_WEB_TIMEOUT: ${AUTH_WEB_TIMEOUT:-20s}
  AUTH_RESEND_IP_LIMIT: ${AUTH_RESEND_IP_LIMIT:-30}
  AUTH_RESEND_EMAIL_LIMIT: ${AUTH_RESEND_EMAIL_LIMIT:-5}
  AUTH_RESEND_WINDOW: ${AUTH_RESEND_WINDOW:-1h}
  AUTH_RESEND_COOLDOWN: ${AUTH_RESEND_COOLDOWN:-60s}
  BOOKSTORE_HTTP_ADDR: :8888
  BOOKSTORE_GRPC_ADDR: :9090
  AGENT_API_URL: http://agent-api:8000
  TRUSTED_PROXY_CIDRS: 172.30.11.20/32
  # Observability is opt-in. An empty endpoint keeps the default profile quiet;
  # compose --profile observability supplies the collector when enabled.
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-agent-common: &agent-common
  # Shared non-secret runtime settings only. Service-specific DSNs and model
  # credentials are deliberately kept in the following two anchors.
  BUSINESS_GRPC_ADDR: bookstore-service:9090
  REDIS_ADDR: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  JWT_PUBLIC_KEY_PATH: /keys/public/jwt-public.pem
  JWT_ISSUER: bookstore
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8088}
  CONFIRMATION_TTL: ${CONFIRMATION_TTL:-10m}
  INVENTORY_WATCH_DEFAULT_TTL: ${INVENTORY_WATCH_DEFAULT_TTL:-30d}
  INVENTORY_WATCH_MAX_TTL: ${INVENTORY_WATCH_MAX_TTL:-90d}
  TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-30}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  BUILD_COMMIT: ${BUILD_COMMIT:-development}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-agent-api-env: &agent-api-env
  <<: *agent-common
  AGENT_MYSQL_DSN: mysql://bookstore_agent:${MYSQL_AGENT_PASSWORD:?run deploy/init-local.ps1}@mysql:3306/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4
  MODEL_BASE_URL: ${MODEL_BASE_URL:?configure model gateway}
  MODEL_API_KEY: ${MODEL_API_KEY:?configure model gateway key}
  MODEL_ADAPTER: ${MODEL_ADAPTER:-deepseek-chat-json-v1}
  MODEL_PROFILE: ${MODEL_PROFILE:-deepseek-flash-v2}
  PROMPT_SET_VERSION: ${PROMPT_SET_VERSION:-v4.2-single-agent-rag}
  AGENT_MODEL: ${AGENT_MODEL:-deepseek-v4-flash}
  MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-8192}
  MODEL_TIMEOUT: ${MODEL_TIMEOUT:-30s}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?configure embedding gateway}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?configure embedding gateway key}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3.7-text-embedding}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-20}
  EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-30s}
  POLICY_COLLECTION_ALIAS: ${POLICY_COLLECTION_ALIAS:-bookstore_policy_current}
  BOOK_COLLECTION_ALIAS: ${BOOK_COLLECTION_ALIAS:-bookstore_book_knowledge_current}
  RAG_INDEX_MANIFEST_PATH: ${RAG_INDEX_MANIFEST_PATH:-runtime/rag-index-manifest.json}
  AGENT_MAX_ROUNDS: ${AGENT_MAX_ROUNDS:-6}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-12}
  AGENT_MAX_PARALLEL_READS: ${AGENT_MAX_PARALLEL_READS:-3}
  AGENT_REQUEST_TIMEOUT: ${AGENT_REQUEST_TIMEOUT:-120s}
  RAG_MAX_CONTEXT_TOKENS: ${RAG_MAX_CONTEXT_TOKENS:-6000}
  GUEST_RATE_LIMIT_HMAC_KEY: ${GUEST_RATE_LIMIT_HMAC_KEY:?run deploy/init-local.ps1}
  GUEST_CHAT_REQUESTS_PER_HOUR: ${GUEST_CHAT_REQUESTS_PER_HOUR:-20}
  GUEST_CHAT_MAX_CONCURRENT_PER_IP: ${GUEST_CHAT_MAX_CONCURRENT_PER_IP:-2}
  GUEST_CHAT_TIMEOUT: ${GUEST_CHAT_TIMEOUT:-120s}

x-agent-worker-env: &agent-worker-env
  # Worker receives only the capabilities used by direct MySQL Outbox,
  # retention cleanup, and legacy vector deletion. It does not receive Redis,
  # business gRPC, JWT, Agent API, or model/embedding credentials.
  WORKER_MYSQL_DSN: mysql://bookstore_worker:${MYSQL_WORKER_PASSWORD:?run deploy/init-local.ps1}@mysql:3306/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4
  QDRANT_URL: http://qdrant:6333
  LEGACY_MEMORY_COLLECTION: ${LEGACY_MEMORY_COLLECTION:-bookstore_memory_qwen37_1024_v1}
  TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-30}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  BUILD_COMMIT: ${BUILD_COMMIT:-development}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-1s}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  OUTBOX_LEASE_TTL: ${OUTBOX_LEASE_TTL:-30s}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}

services:
  mysql:
    image: mysql:8.0.45
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run deploy/init-local.ps1}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookstore}
    command: [--default-time-zone=+00:00]
    volumes: [mysql-data:/var/lib/mysql]
    networks: [bookstore]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    environment:
      REDIS_ARGS: --appendonly yes --appendfsync everysec
    volumes: [redis-data:/data]
    networks: [bookstore]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes: [qdrant-data:/qdrant/storage]
    networks: [bookstore]
    healthcheck:
      # The pinned Qdrant image has bash but intentionally ships no curl/wget.
      # Use bash's TCP device and require an HTTP 200 status instead of merely
      # checking that the container process exists.
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /healthz HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' >&3; IFS= read -r line <&3; [[ $$line == *' 200 '* ]]" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit@sha256:c96991d9bef73594c246d89ca81411d4e916f03e76a7d2d72fa2ab5dd3c9ce24
    ports: [127.0.0.1:8025:8025]
    networks: [bookstore]
    restart: unless-stopped

  migrate:
    <<: *go-image
    command: [bookstore-migrate]
    restart: "no"
    environment:
      BOOKSTORE_MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:?run deploy/init-local.ps1}@tcp(mysql:3306)/${MYSQL_DATABASE:-bookstore}?charset=utf8mb4&parseTime=true&loc=UTC
    volumes: []
    depends_on:
      mysql: {condition: service_healthy}

  bootstrap:
    <<: *agent-image
    user: "0:0"
    command: [python, /app/deploy/bootstrap.py]
    restart: "no"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookstore}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?run deploy/init-local.ps1}
      MYSQL_BUSINESS_PASSWORD: ${MYSQL_BUSINESS_PASSWORD:?run deploy/init-local.ps1}
      MYSQL_AGENT_PASSWORD: ${MYSQL_AGENT_PASSWORD:?run deploy/init-local.ps1}
      MYSQL_WORKER_PASSWORD: ${MYSQL_WORKER_PASSWORD:?run deploy/init-local.ps1}
    volumes:
      - jwt-private:/keys/private
      - jwt-public:/keys/public
    depends_on:
      migrate: {condition: service_completed_successfully}

  bookstore-service:
    <<: *go-image
    command: [bookstore-service]
    environment:
      <<: *business-env
    volumes:
      - jwt-private:/keys/private:ro
      - jwt-public:/keys/public:ro
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8888/api/books/search?limit=1]
      interval: 5s
      timeout: 4s
      retries: 30

  agent-api:
    <<: *agent-image
    environment:
      <<: *agent-api-env
    volumes:
      - jwt-public:/keys/public:ro
      - rag-manifest:/app/agent/runtime
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      bookstore-service: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30

  agent-worker:
    <<: *agent-image
    command: [agent-worker]
    environment:
      <<: *agent-worker-env
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      bookstore-service: {condition: service_healthy}
      qdrant: {condition: service_healthy}

  nginx:
    image: bookstore-web:local
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["127.0.0.1:${APP_PORT:-8088}:80"]
    networks:
      bookstore:
        ipv4_address: 172.30.11.20
    depends_on:
      bookstore-service: {condition: service_healthy}
      agent-api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://127.0.0.1/healthz >/dev/null]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.13.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports: [127.0.0.1:9090:9090]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [bookstore]
    depends_on: [bookstore-service, agent-api, agent-worker]
    restart: unless-stopped

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.5
    command: [-config.file=/etc/tempo/tempo.yml]
    ports: [127.0.0.1:3200:3200]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks: [bookstore]
    restart: unless-stopped

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.158.0
    command: [--config=/etc/otelcol-contrib/config.yml]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    networks: [bookstore]
    depends_on: [tempo]
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.1.0
    ports: [127.0.0.1:3001:3000]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run deploy/init-local.ps1}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [bookstore]
    depends_on: [prometheus, tempo]
    restart: unless-stopped

networks:
  bookstore:
    ipam:
      config: [{subnet: 172.30.11.0/24, ip_range: 172.30.11.128/25}]

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  jwt-private:
  jwt-public:
  rag-manifest:
  prometheus-data:
  tempo-data:
  grafana-data:
