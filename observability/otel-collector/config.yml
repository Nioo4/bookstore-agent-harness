extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 1024
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - keep_keys(resource.attributes, ["service.name", "service.version"])
          - keep_keys(scope.attributes, [])
          - set(scope.name, "bookstore")
          - set(scope.version, "")
          - set(span.status.message, "")
          - set(span.trace_state, "")
          - keep_keys(span.attributes, ["http.route", "http.response.status_code", "http.status_code", "agent.name", "tool.name", "agent.model_profile", "run.status", "operation.status", "error.code", "trace.persistent"])
          - set(span.name, "go.operation") where not IsMatch(span.name, "^(http.request|guest.chat|agent.node|tool.invoke|model.complete|model.embed|rpc.catalog.search|rpc.catalog.get|rpc.order.prepare|rpc.order.decide|rpc.order.get|rpc.order.list|inventory.consume)$")
          - delete_key(span.attributes, "http.route") where span.attributes["http.route"] != nil and not IsMatch(span.attributes["http.route"], "^/api/(chat/conversations/\\{conversation_id\\}/(messages|confirmations)|memories(/\\{memory_id\\})?|tasks(/inventory-watches|/\\{task_id\\}(/cancel)?)?|notifications(/\\{notification_id\\}/read)?|traces(/\\{run_id\\})?)$")
  filter/privacy:
    error_mode: propagate
    trace_conditions:
      # Runtime telemetry emits no links. Reject unexpected linked spans rather
      # than retaining attributes hidden inside them.
      - context: span
        conditions: ["Len(span.links) > 0"]
      - context: spanevent
        conditions: ["true"]

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/privacy
        - transform/privacy
        - batch
      exporters:
        - otlp/tempo
