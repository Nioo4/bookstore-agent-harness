# Docker embedded DNS; refresh after a service is recreated with a new IP.
upstream bookstore_go {
    zone bookstore_go 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server go-api:8888 resolve;
}
upstream bookstore_web {
    zone bookstore_web 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server web:3000 resolve;
}

server {
    listen 80;
    server_name _;
    access_log off;
    # Nginx error entries may contain verification-token query strings.
    # Health checks and sanitized application telemetry provide diagnostics.
    error_log /dev/null;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /api/evals { return 404; }
    location ^~ /internal/ { return 404; }
    location /api/books {
        proxy_pass http://bookstore_go;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/hot-books {
        proxy_pass http://bookstore_go;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Existing Next.js BFF owns the HttpOnly-cookie-to-Bearer adaptation.
    location / {
        proxy_pass http://bookstore_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
    }
}
