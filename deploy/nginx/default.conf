upstream bookstore_service {
    zone bookstore_service 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server bookstore-service:8888 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    error_log /dev/stderr warn;

    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Go BFF is the only browser-facing API target. It proxies the allowlisted
    # Agent routes and owns HttpOnly-cookie/JWT adaptation.
    location ^~ /api/ {
        proxy_pass http://bookstore_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }

    # Vite SPA fallback; asset paths remain cacheable by the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
