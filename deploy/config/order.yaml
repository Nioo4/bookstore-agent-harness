Name: order.rpc
ListenOn: 0.0.0.0:8083
Timeout: 10000
Mode: pro
Log:
  Mode: console
  Level: error
Etcd:
  Hosts: [etcd:2379]
  Key: order.rpc
DataSource: "${MYSQL_DSN}"
BusinessRedis:
  Address: redis:6379
  Password: ""
  DB: 0
JWT:
  PublicKeyPath: /keys/public/jwt-public.pem
  Issuer: bookstore
ConfirmationTTL: "${CONFIRMATION_TTL}"
Middlewares:
  Stat: false
Prometheus:
  Host: 0.0.0.0
  Port: 9105
  Path: /metrics
Telemetry:
  Name: bookstore-order-rpc
  Endpoint: otel-collector:4317
  Sampler: 1.0
  Batcher: otlpgrpc
