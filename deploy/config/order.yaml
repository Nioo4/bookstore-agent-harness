Name: order.rpc
ListenOn: 0.0.0.0:8083
Timeout: 10000
Mode: pro
Log:
  Mode: console
  Level: error
DataSource: "${MYSQL_DSN}"
BusinessRedis:
  Address: redis:6379
  Password: ""
  DB: 0
JWT:
  PublicKeyPath: /keys/public/jwt-public.pem
  Issuer: bookstore
ConfirmationTTL: "${CONFIRMATION_TTL}"
Middlewares:
  Stat: false
Prometheus:
  Host: 0.0.0.0
  Port: 9105
  Path: /metrics
Telemetry:
  Name: bookstore-service-order
  Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
