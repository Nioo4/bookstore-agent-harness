Name: check.rpc
ListenOn: 0.0.0.0:8081
Timeout: 3000
Mode: pro
Log:
  Mode: console
  Level: error
DataSource: "${MYSQL_DSN}"
Table: book
Cache:
  - Host: redis:6379
CacheFallback:
  CacheTimeout: 250ms
  MaxConcurrent: 32
Middlewares:
  Stat: false
Prometheus:
  Host: 0.0.0.0
  Port: 9103
  Path: /metrics
Telemetry:
  Name: bookstore-service-catalog
  Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
