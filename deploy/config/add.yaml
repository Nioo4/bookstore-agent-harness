Name: add.rpc
ListenOn: 0.0.0.0:8080
Timeout: 3000
Mode: pro
Log:
  Mode: console
  Level: error
Etcd:
  Hosts: [etcd:2379]
  Key: add.rpc
DataSource: "${MYSQL_DSN}"
Table: book
Cache:
  - Host: redis:6379
Middlewares:
  Stat: false
Prometheus:
  Host: 0.0.0.0
  Port: 9102
  Path: /metrics
Telemetry:
  Name: bookstore-add-rpc
  Endpoint: otel-collector:4317
  Sampler: 1.0
  Batcher: otlpgrpc
