Name: bookstore-api
Host: 0.0.0.0
Port: 8888
Timeout: 5000
AuthBudget:
  SMTP: ${SMTP_SEND_TIMEOUT}
  RPC: ${AUTH_RPC_TIMEOUT}
  HTTP: ${AUTH_HTTP_TIMEOUT}
  Web: ${AUTH_WEB_TIMEOUT}
TrustedProxyCIDRs: ["${TRUSTED_PROXY_CIDRS}"]
JWT:
  PublicKeyPath: /keys/public/jwt-public.pem
  Issuer: bookstore
Log:
  ServiceName: bookstore-api
  Mode: console
  Level: error
Middlewares:
  Log: false
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics
Telemetry:
  Name: bookstore-api
  Endpoint: otel-collector:4317
  Sampler: 1.0
  Batcher: otlpgrpc
Add:
  Endpoints: [add-rpc:8080]
  Timeout: 3000
Check:
  Endpoints: [check-rpc:8081]
  Timeout: 3000
Auth:
  Endpoints: [auth-rpc:8082]
Order:
  Endpoints: [order-rpc:8083]
  Timeout: 5000
StockRateLimit:
  Enabled: true
  Rate: 100
  Burst: 200
  Key: bookstore:stock-deduct
  Redis:
    Host: redis:6379
    Type: node
HotCache:
  Enabled: true
  TTL: 2s
  Limit: 1024
