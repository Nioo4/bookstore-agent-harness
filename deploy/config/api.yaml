Name: bookstore-service
Host: 0.0.0.0
Port: 8888
Timeout: 5000
AuthBudget:
  SMTP: ${SMTP_SEND_TIMEOUT}
  RPC: ${AUTH_RPC_TIMEOUT}
  HTTP: ${AUTH_HTTP_TIMEOUT}
  Web: ${AUTH_WEB_TIMEOUT}
TrustedProxyCIDRs: ["${TRUSTED_PROXY_CIDRS}"]
CookieSecure: ${COOKIE_SECURE}
AppBaseURL: "${APP_BASE_URL}"
AgentAPIURL: "${AGENT_API_URL}"
JWT:
  PublicKeyPath: /keys/public/jwt-public.pem
  Issuer: bookstore
Log:
  ServiceName: bookstore-service
  Mode: console
  Level: error
Middlewares:
  Log: false
Prometheus:
  Host: 0.0.0.0
  Port: 9101
  Path: /metrics
Telemetry:
  Name: bookstore-service
  # Empty by default; the observability Compose profile supplies an endpoint.
  Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  Sampler: 1.0
  Batcher: otlpgrpc
Add:
  Endpoints: [bookstore-service:9090]
  Timeout: 3000
Check:
  Endpoints: [bookstore-service:9090]
  Timeout: 3000
Auth:
  Endpoints: [bookstore-service:9090]
Order:
  Endpoints: [bookstore-service:9090]
  Timeout: 5000
StockRateLimit:
  Enabled: true
  Rate: 100
  Burst: 200
  Key: bookstore:stock-deduct
  Redis:
    Host: redis:6379
    Type: node
HotCache:
  Enabled: true
  TTL: 2s
  Limit: 1024
